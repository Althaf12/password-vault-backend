name: Password Vault Backend Deploy on RP5 (Self-hosted)

on:
  push:
    branches: ["main"]

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Update backend code
        run: |
          sudo -u passwordvault git -C /opt/password-vault-backend pull origin main

      - name: Build backend
        run: |
          cd /opt/password-vault-backend
          sudo -u passwordvault mvn clean package -DskipTests

      - name: Restart backend service
        run: |
          sudo systemctl restart password-vault-backend

      - name: Done
        run: echo "Password Vault Backend deployed successfully."